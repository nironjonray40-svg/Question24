<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google - আলহেরা এডুকেয়ার হোম</title>
    <!-- Google Fonts: Roboto & Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[450px] bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-200 text-slate-800">
        
        <!-- Google Official Logo -->
        <div class="flex justify-center mb-5">
            <svg class="w-9 h-9" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Sign in with Google</h1>
            <p class="text-xs text-slate-500 mt-1">
                to continue to <span class="font-semibold text-slate-700">আলহেরা প্রশ্ন ব্যাংক</span>
            </p>
        </div>

        <!-- Detected Accounts Quick Select List -->
        <div id="quickAccountsList" class="space-y-2.5 mb-6">
            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider text-left">Choose an account</p>
            
            <!-- Account 1: DSNSM -->
            <button type="button" onclick="selectAndVerifyAccount('dsnsmai1995@gmail.com', 'DSNSM')" class="w-full p-3 rounded-2xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 transition-all flex items-center justify-between group cursor-pointer text-left">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                        D
                    </div>
                    <div>
                        <div class="text-sm font-bold text-slate-900 group-hover:text-blue-700">DSNSM</div>
                        <div class="text-xs text-slate-500">dsnsmai1995@gmail.com</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-blue-600 text-xs"></i>
            </button>

            <!-- Account 2: Nironjon Ray -->
            <button type="button" onclick="selectAndVerifyAccount('nironjonray40@gmail.com', 'নীরঞ্জন রায়')" class="w-full p-3 rounded-2xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 transition-all flex items-center justify-between group cursor-pointer text-left">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                        N
                    </div>
                    <div>
                        <div class="text-sm font-bold text-slate-900 group-hover:text-blue-700">নীরঞ্জন রায় (Nironjon Ray)</div>
                        <div class="text-xs text-slate-500">nironjonray40@gmail.com</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-blue-600 text-xs"></i>
            </button>
        </div>

        <!-- Custom Account Entry Form -->
        <div class="border-t border-slate-100 pt-5">
            <div class="mb-4 text-left">
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Use another account / নতুন একাউন্ট দিন:</label>
                <div class="relative">
                    <input type="email" id="customEmailInput" placeholder="Email or phone" onkeydown="if(event.key === 'Enter') verifyCustomAccount()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-sm text-slate-900 focus:outline-none transition-all">
                </div>
            </div>

            <div class="flex items-center justify-between pt-2">
                <button type="button" onclick="window.close()" class="text-xs font-semibold text-blue-600 hover:text-blue-800">
                    Cancel
                </button>
                <button type="button" onclick="verifyCustomAccount()" id="nextBtn" class="px-6 py-2.5 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
                    <span>Next</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </div>
        </div>

        <!-- Verification Loading State -->
        <div id="verifyingState" class="hidden text-center py-8">
            <div class="w-10 h-10 border-3 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p class="text-sm font-bold text-slate-800">Verifying Google Account...</p>
            <p class="text-xs text-slate-500 mt-0.5" id="verifyingEmailText">dsnsmai1995@gmail.com</p>
        </div>

    </div>

    <script>
        function selectAndVerifyAccount(email, name) {
            document.getElementById('quickAccountsList').classList.add('hidden');
            document.querySelector('.border-t').classList.add('hidden');
            document.getElementById('verifyingState').classList.remove('hidden');
            document.getElementById('verifyingEmailText').textContent = email;

            setTimeout(() => {
                completeVerification(email, name);
            }, 600);
        }

        function verifyCustomAccount() {
            const input = document.getElementById('customEmailInput');
            let email = (input.value || '').trim();
            if (!email) {
                input.focus();
                input.classList.add('border-red-500', 'ring-2', 'ring-red-100');
                return;
            }
            if (!email.includes('@')) {
                email += '@gmail.com';
            }
            const name = email.split('@')[0].replace(/[\._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            selectAndVerifyAccount(email, name);
        }

        function completeVerification(email, name) {
            // Communicate back to parent landing page window
            if (window.opener && !window.opener.closed) {
                if (typeof window.opener.onGoogleAccountVerified === 'function') {
                    window.opener.onGoogleAccountVerified(email, name);
                } else {
                    window.opener.postMessage({
                        type: 'GOOGLE_AUTH_VERIFIED',
                        email: email,
                        name: name
                    }, '*');
                }
            }
            window.close();
        }
    </script>
</body>
</html>
